name: Build win32 Debug (.exe)

on:
  workflow_dispatch:

env:
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  VCPKG_ROOT: ${{ github.workspace }}/Build/vcpkg-debug
  CCACHE_COMPILERCHECK: "%compiler% -v"
  RUSTFLAGS: "-C target-cpu=x86-64-v3"

jobs:
  prepare-dependencies:
    name: Prepare & Cache Debug Dependencies
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Upstream Ladybird Code
        uses: actions/checkout@v4
        with:
          repository: 'LadybirdBrowser/ladybird'
          ref: 'master'

      - name: Install Latest LLVM 23 from GitHub
        run: |
          Write-Host "Downloading LLVM 23 installer..."
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.6/LLVM-23.1.6-win64.msi"
          Invoke-WebRequest -Uri $url -OutFile "llvm_installer.msi"
          
          Write-Host "Installing LLVM 23 silently..."
          Start-Process -FilePath ".\llvm_installer.msi" -ArgumentList "/quiet" -Wait
          
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
        shell: pwsh
          
      - name: Set Up Environment
        uses: ./.github/actions/setup
        with:
          os: 'Windows'
          arch: 'x86_64'
          toolchain: 'ClangCL'
          build_preset: 'Debug'

      - name: Restore Caches
        uses: ./.github/actions/cache-restore
        id: 'cache-restore'
        with:
          os: 'Windows'
          arch: 'x86_64'
          toolchain: 'ClangCL'
          cache_key_extra: 'Windows_CI_Debug'
          ccache_path: ${{ env.CCACHE_DIR }}
          sccache_path: ${{ github.workspace }}/.sccache
          vcpkg_cache_path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache

      - name: Patch Unused Variable Warnings
        run: |
          $file1 = "Libraries/LibWebView/CrashReport.cpp"
          if (Test-Path $file1) {
              (Get-Content $file1) -replace 'static DisableSandbox s_disable_sandbox', '[[maybe_unused]] static DisableSandbox s_disable_sandbox' | Set-Content $file1
          }
          $file2 = "Services/Compositor/FontSkia.cpp"
          if (Test-Path $file2) {
              (Get-Content $file2) -replace 'static bool s_use_test_font_rendering', '[[maybe_unused]] static bool s_use_test_font_rendering' | Set-Content $file2
          }
          Get-ChildItem -Path "Meta/CMake" -Recurse -Filter "*.cmake" | ForEach-Object {
              (Get-Content $_.FullName) -replace '-march=native', '-march=x86-64-v3' | Set-Content $_.FullName
          }

      - name: Configure CMake (Compiles VCPKG Dependencies)
        working-directory: ${{ github.workspace }}
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: |
          cmake --preset Debug -B Build `
            -DENABLE_CI_BASELINE_CPU=ON `
            -DCMAKE_C_FLAGS="-march=x86-64-v3" `
            -DCMAKE_CXX_FLAGS="-march=x86-64-v3" `
            -DENABLE_TESTS=OFF `
            -DBUILD_TESTING=OFF `
            -DENABLE_LAGOM_TESTS=OFF

      - name: Save Dependencies to Cache
        uses: ./.github/actions/cache-save
        with:
          arch: 'x86_64'
          ccache_path: ${{ env.CCACHE_DIR }}
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          sccache_path: ${{ github.workspace }}/.sccache
          sccache_primary_key: ${{ steps.cache-restore.outputs.sccache_primary_key }}
          vcpkg_cache_path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

  build-windows-debug:
    name: Build & Package Ladybird
    needs: prepare-dependencies
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Upstream Ladybird Code
        uses: actions/checkout@v4
        with:
          repository: 'LadybirdBrowser/ladybird'
          ref: 'master'

      - name: Get Upstream Commit Hash
        id: upstream_info
        run: |
          $shortSha = git rev-parse --short HEAD
          echo "UPSTREAM_SHA=$shortSha" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install Latest LLVM 23 from GitHub
        run: |
          Write-Host "Downloading LLVM 23 installer..."
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.6/LLVM-23.1.6-win64.msi"
          Invoke-WebRequest -Uri $url -OutFile "llvm_installer.msi"
          
          Write-Host "Installing LLVM 23 silently..."
          Start-Process -FilePath ".\llvm_installer.msi" -ArgumentList "/quiet" -Wait
          
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
        shell: pwsh
        
      - name: Set Up Environment
        uses: ./.github/actions/setup
        with:
          os: 'Windows'
          arch: 'x86_64'
          toolchain: 'ClangCL'
          build_preset: 'Debug'

      - name: Restore Cached Dependencies
        uses: ./.github/actions/cache-restore
        id: 'cache-restore'
        with:
          os: 'Windows'
          arch: 'x86_64'
          toolchain: 'ClangCL'
          cache_key_extra: 'Windows_CI_Debug'
          ccache_path: ${{ env.CCACHE_DIR }}
          sccache_path: ${{ github.workspace }}/.sccache
          vcpkg_cache_path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache

      - name: Patch Unused Variable Warnings
        run: |
          $file1 = "Libraries/LibWebView/CrashReport.cpp"
          if (Test-Path $file1) {
              (Get-Content $file1) -replace 'static DisableSandbox s_disable_sandbox', '[[maybe_unused]] static DisableSandbox s_disable_sandbox' | Set-Content $file1
          }
          $file2 = "Services/Compositor/FontSkia.cpp"
          if (Test-Path $file2) {
              (Get-Content $file2) -replace 'static bool s_use_test_font_rendering', '[[maybe_unused]] static bool s_use_test_font_rendering' | Set-Content $file2
          }

      - name: Configure CMake
        working-directory: ${{ github.workspace }}
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: |
          cmake --preset Debug -B Build `
            -DENABLE_CI_BASELINE_CPU=ON `
            -DCMAKE_C_FLAGS="-march=x86-64-v3" `
            -DCMAKE_CXX_FLAGS="-march=x86-64-v3" `
            -DENABLE_TESTS=OFF `
            -DBUILD_TESTING=OFF `
            -DENABLE_LAGOM_TESTS=OFF

      - name: Build
        working-directory: ${{ github.workspace }}/Build
        run: |
          cmake --build .

      - name: Bundle Complete Debug Package
        run: |
          $buildDir = "${{ github.workspace }}/Build"
          $binDir = "$buildDir/bin"
          $libexecDir = "$buildDir/libexec"
          $packageDir = "${{ github.workspace }}/Package"

          if (Test-Path $libexecDir) {
              Write-Host "Moving helper executables from libexec to bin..."
              Copy-Item "$libexecDir/*.exe" -Destination $binDir -Force -ErrorAction SilentlyContinue
              Copy-Item "$libexecDir/*.pdb" -Destination $binDir -Force -ErrorAction SilentlyContinue
          }

          $vcpkgDebugBin = "$buildDir/vcpkg_installed/x64-windows/debug/bin"
          if (Test-Path $vcpkgDebugBin) {
              Write-Host "Copying vcpkg debug DLLs..."
              Copy-Item "$vcpkgDebugBin/*.dll" -Destination $binDir -Force -ErrorAction SilentlyContinue
          }

          Write-Host "Locating DirectX compiler DLLs..."
          $d3dFile = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "d3dcompiler_47.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if ($d3dFile) {
              $sdkBin = $d3dFile.DirectoryName
              Copy-Item "$sdkBin/d3dcompiler_47.dll" -Destination $binDir -Force -ErrorAction SilentlyContinue
              Copy-Item "$sdkBin/dxcompiler.dll" -Destination $binDir -Force -ErrorAction SilentlyContinue
              Copy-Item "$sdkBin/dxil.dll" -Destination $binDir -Force -ErrorAction SilentlyContinue
              Write-Host "Copied DirectX compiler DLLs from $sdkBin"
          }

          Write-Host "Locating MSVC debug runtime DLLs..."
          $msvcDebugDir = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Directory -Filter "debug_nonredist" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if ($msvcDebugDir) {
              Copy-Item "$($msvcDebugDir.FullName)/*.dll" -Destination $binDir -Force -ErrorAction SilentlyContinue
              Write-Host "Copied MSVC debug runtime DLLs from $($msvcDebugDir.FullName)"
          }

          $ucrtFile = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "ucrtbased.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if ($ucrtFile) {
              Copy-Item $ucrtFile.FullName -Destination $binDir -Force -ErrorAction SilentlyContinue
              Write-Host "Copied ucrtbased.dll from $($ucrtFile.FullName)"
          }

          $icuFile = Get-ChildItem -Path "$buildDir" -Recurse -Filter "icudt*.dat" | Select-Object -First 1
          if ($icuFile) {
              Copy-Item $icuFile.FullName -Destination $binDir -Force
              Write-Host "Placed $($icuFile.Name) directly into bin"
          }

          Write-Host "Staging files into package structure..."
          New-Item -ItemType Directory -Force -Path "$packageDir/bin"
          New-Item -ItemType Directory -Force -Path "$packageDir/share"

          Copy-Item "$binDir/*" -Destination "$packageDir/bin" -Recurse -Force

          if (Test-Path "$buildDir/share") {
              Copy-Item "$buildDir/share/*" -Destination "$packageDir/share" -Recurse -Force
          }
          
          Write-Host "Compressing complete Debug package..."
          Compress-Archive -Path "$packageDir/*" -DestinationPath "${{ github.workspace }}/Ladybird-Windows-Debug.zip" -Force
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-Windows-Debug
          path: Ladybird-Windows-Debug.zip
          if-no-files-found: error

      - name: Set Release Variables
        id: set_vars
        run: |
          $releaseDate = Get-Date -Format "yyyyMMdd"
          $releaseTag = "v${releaseDate}-debug-${{ github.run_number }}"
          $releaseName = "Debug Release ${releaseDate} (Run ${{ github.run_number }})"
          echo "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          echo "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Automated Debug build tracking upstream commit LadybirdBrowser/ladybird@${{ env.UPSTREAM_SHA }}.
            Includes full PDB symbols for crash inspection and diagnosis.
          draft: false
          prerelease: true
          files: |
            Ladybird-Windows-Debug.zip

      - name: Save Caches
        uses: ./.github/actions/cache-save
        with:
          arch: 'x86_64'
          ccache_path: ${{ env.CCACHE_DIR }}
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          sccache_path: ${{ github.workspace }}/.sccache
          sccache_primary_key: ${{ steps.cache-restore.outputs.sccache_primary_key }}
          vcpkg_cache_path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}
